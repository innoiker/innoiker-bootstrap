[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "innoiker-bootstrap"
version = "0.1.0"
description = "Innoiker host environment bootstrapper and project creator"
requires-python = ">=3.14"

[project.scripts]
inno = "innoiker_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
